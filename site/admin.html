<style>

.top b { font-size: 16px; }

.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px max(16px, env(safe-area-inset-left)); border-bottom: 1px solid var(--seam); }

button.on, button.main { background: var(--violet); border-color: var(--violet); color: #fff; }

h2 { font-size: 20px; margin: 6px 0 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { background: var(--vault); border: 1px solid var(--seam); border-radius: 14px; padding: 14px; }
.tile small { color: var(--muted); display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.tile b { font-size: 22px; font-variant-numeric: tabular-nums; }
details.sec { background: var(--vault); border: 1px solid var(--seam); border-radius: 14px; margin-bottom: 10px; }

details.sec > summary::after { content: "▾"; margin-left: auto; color: var(--muted); }
details.sec[open] > summary::after { content: "▴"; }
details.sec > summary b { white-space: nowrap; }
details.sec > summary span { color: var(--muted); font-weight: 500; font-size: 13px; min-width: 0; }
@media (max-width: 520px) { details.sec > summary { flex-wrap: wrap; } details.sec > summary span { flex-basis: 100%; order: 3; } }
.form { padding: 0 16px 16px; display: grid; gap: 12px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field label { font-size: 13px; color: var(--muted); font-weight: 600; }
.field .hint { font-size: 12px; color: var(--muted); }
input[type=text], input[type=number], select, textarea { width: 100%; background: var(--ink); color: var(--text); border: 1px solid var(--seam); border-radius: 10px; padding: 9px 11px; font: 14px var(--body); }
textarea { min-height: 80px; resize: vertical; font-family: var(--body); }
textarea.json { font: 12px var(--mono); min-height: 110px; }
select[multiple] { min-height: 120px; }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.switch input { width: 20px; height: 20px; accent-color: var(--violet); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.sub { border-left: 3px solid var(--seam); padding-left: 12px; display: grid; gap: 12px; }
.sub > b { font-size: 13px; color: var(--rose); }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--vault2); border: 1px solid var(--seam); padding: 10px 16px; border-radius: 12px; font-weight: 600; z-index: 9; }
.toast.ok { border-color: var(--ok); } .toast.bad { border-color: var(--bad); }
.logs { font: 12px/1.5 var(--mono); background: #07050f; border: 1px solid var(--seam); border-radius: 12px; padding: 12px; max-height: 70vh; overflow: auto; white-space: pre-wrap; word-break: break-word; }
.logs .error { color: var(--bad); } .logs .warn { color: var(--warn); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td, th { text-align: left; padding: 8px; border-bottom: 1px solid var(--seam); vertical-align: top; }
.tablewrap { overflow-x: auto; }
.muted { color: var(--muted); }
.card { background: var(--vault); border: 1px solid var(--seam); border-radius: 16px; margin-bottom: 14px; scroll-margin-top: 120px; }
.card.form, .form.card { padding: 16px; }
.cardhead { padding: 16px 16px 4px; }
.cardhead h3 { margin: 0; font-size: 17px; }
.cardhead p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.card > .form { padding-top: 12px; }
.jump { display: flex; flex-wrap: wrap; gap: 8px; margin: -4px 0 16px; }
.jump a { font-size: 13px; color: var(--muted); text-decoration: none; border: 1px solid var(--seam); border-radius: 999px; padding: 5px 10px; }
.jump a:hover { color: var(--text); border-color: var(--violet); }
.rowsed { display: grid; gap: 8px; }
.rowslist { display: grid; gap: 8px; }
.rowline { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; background: var(--ink); border: 1px solid var(--seam); border-radius: 12px; padding: 10px; }
.rowline .cell { display: grid; gap: 4px; flex: 1 1 150px; min-width: 0; }
.rowline .cell span { font-size: 12px; color: var(--muted); font-weight: 600; }
.rowline .rowtitle { flex: 1 1 100%; font-size: 14px; }
button.icon { width: 38px; height: 38px; padding: 0; flex: none; }
button.add { justify-self: start; border-style: dashed; color: var(--muted); }
button.add:hover { color: var(--text); }
.pagecard { text-align: left; display: grid; gap: 4px; padding: 14px; border-radius: 14px; }
.pagecard span { color: var(--muted); font-weight: 500; font-size: 13px; }
input[type=color] { width: 64px; height: 38px; padding: 2px; border-radius: 10px; border: 1px solid var(--seam); background: var(--ink); }
.top > div { min-width: 0; flex: 1 1 auto; }
.top b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .btn, .top button { flex: none; padding: 7px 11px; font-size: 13px; }
</style>
</head>

  function field(key, base, value, where) {
    var box = el("div", { class: "field" });
    var name = PATH_LABELS[where + "." + key] || label(key);
    var special = SPECIAL[where + "." + key];
    if (special) {
      var sp = special(value);
      box.appendChild(el("label", { text: name })); box.appendChild(sp[0]);
      return [box, sp[1]];
    }
    var read;
    if (typeof base === "boolean") {
      var cb = el("input", { type: "checkbox" }); cb.checked = !!value;
      box.appendChild(el("label", { class: "switch" }, [cb, name]));
      return [box, function () { return cb.checked; }];
    }
    box.appendChild(el("label", { text: name }));
    if (typeof base === "string" && CHOICES[key]) {
      var cs = select(CHOICES[key], value, false, false); box.appendChild(cs);
      read = function () { return cs.value; };
    } else if (typeof base === "number") {
      var n = el("input", { type: "number", step: "any", value: String(value) }); box.appendChild(n);
      read = function () { return Number(n.value); };
    } else if (typeof base === "string" && (isChannelKey(key) || isCategoryKey(key) || isRoleKey(key))) {
      var opts = isRoleKey(key) ? roleOpts() : channelOptions(isCategoryKey(key) ? "category" : ["members", "trades", "vouches"].indexOf(key) >= 0 ? "voice" : "text");
      var sel = select(opts, value, false); box.appendChild(sel);
      read = function () { return sel.value; };
    } else if (typeof base === "string" || base === null) {
      var long = (value && String(value).length > 60) || /message|leave|text/i.test(key);
      var inp = long ? el("textarea", {}) : el("input", { type: "text" });
      inp.value = value == null ? "" : String(value); box.appendChild(inp);
      read = function () { return inp.value; };
    } else if (Array.isArray(base) && (key === "channels" || key === "ignored")) {
      var ms = select(channelOptions("text"), value, true); box.appendChild(ms); box.appendChild(el("div", { class: "hint", text: "Pour en choisir plusieurs : Ctrl + clic, ou appui long sur téléphone." }));
      read = function () { return picked(ms); };
    } else if (Array.isArray(base) && key === "roles") {
      var mr = select(roleOpts(), value, true); box.appendChild(mr);
      read = function () { return picked(mr); };
    } else if (Array.isArray(base) && (key === "domains" || key === "words")) {
      var ta = el("textarea", {}); ta.value = (value || []).join("\n"); box.appendChild(ta);
      read = function () { return ta.value.split("\n").map(function (x) { return x.trim(); }).filter(Boolean); };
    } else {
      var js = el("textarea", { class: "json" }); js.value = JSON.stringify(value, null, 2); box.appendChild(js);
      read = function () { return JSON.parse(js.value); };
    }
    return [box, read];
  }
  /* the fields of a group of settings (and of the groups inside it) */
  function groupFields(container, base, cur, where) {
    var readers = {};
    Object.keys(base).forEach(function (k) {
      if (HIDDEN.indexOf(k) >= 0 || where + "." + k === "supporter.channelId") return;
      var b = base[k];
      if (b && typeof b === "object" && !Array.isArray(b) && Object.keys(b).length && !SPECIAL[where + "." + k]) {
        var sub = el("div", { class: "sub" }, [el("b", { text: PATH_LABELS[where + "." + k] || label(k) })]);
        readers[k] = groupFields(sub, b, (cur || {})[k] || {}, k);
        container.appendChild(sub);
        return;
      }
      var f = field(k, b, (cur || {})[k], where);
      container.appendChild(f[0]); readers[k] = f[1];
    });
    return function () { var o = {}; for (var k in readers) o[k] = readers[k](); return o; };
  }
  function sectionCard(name) {
    var base = S.defaults[name], cur = S.cfg[name];
    var card = el("section", { class: "card", id: "m-" + name }, [el("div", { class: "cardhead" }, [el("h3", { text: SECTIONS[name][0] }), el("p", { text: SECTIONS[name][1] })])]);
    var form = el("div", { class: "form" });
    var read;
    if (name === "index") {
      var ix = indexEditor(cur); form.appendChild(ix[0]);
      read = ix[1];
    } else read = groupFields(form, base, cur, name);
    var saveBtn = el("button", { class: "main", type: "button", text: "Enregistrer", onclick: function () {
      var value;
      try { value = read(); } catch (e) { toast("Un réglage n'est pas valide.", false); return; }
      if (name === "supporter" && Array.isArray(value.langs)) value.langs = Object.fromEntries(value.langs);
      if (name === "values" && Array.isArray(value.overrides)) {
        var map = {}; value.overrides.forEach(function (o) { var k = vkey(o.name); if (!k) return; map[k] = map[k] || { __name: o.name }; map[k][o.mut] = o.g; }); value.overrides = map;
      }
      saveBtn.disabled = true;
      api("/api/cfg", { section: name, value: value }).then(function (r) { S.cfg[name] = r.cfg; toast("Enregistré ✓", true); }).catch(function (e) { toast(e.message, false); }).then(function () { saveBtn.disabled = false; });
    } });
    form.appendChild(el("div", { class: "row" }, [saveBtn]));
    card.appendChild(form);
    return card;
  }
  var VIEWS = {
    home: function (v) {
      var fmtUp = function (s) { var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return (d ? d + " j " : "") + h + " h " + m + " min"; };
      v.appendChild(el("h2", { text: S.guild ? S.guild.name : "Serveur" }));
      var g = el("div", { class: "grid" });
      [["Membres", S.guild ? S.guild.members : "—"], ["Ping", S.bot.ping == null ? "—" : S.bot.ping + " ms"], ["En ligne depuis", fmtUp(S.bot.uptime)], ["Mémoire", S.bot.memory + " Mo"], ["Vouches", S.stats.vouches], ["Membres avec XP", S.stats.xpMembers], ["Scammers", S.stats.scams], ["Brainrots (valeurs)", S.stats.values]]
        .forEach(function (x) { g.appendChild(el("div", { class: "tile" }, [el("small", { text: x[0] }), el("b", { text: String(x[1]) })])); });
      v.appendChild(g);
      var links = el("div", { class: "grid", style: "margin-top:18px" });
      PAGES.forEach(function (p) { if (!p[2]) return; links.appendChild(el("button", { type: "button", class: "pagecard", onclick: function () { tab = p[0]; draw(); } }, [el("b", { text: p[1] }), el("span", { text: p[2].map(function (n) { return SECTIONS[n][0].replace(/^\S+\s/, ""); }).join(" · ") })])); });
      v.appendChild(links);
      v.appendChild(el("p", { class: "muted", text: "Les réglages changés ici sont pris en compte tout de suite, sans redémarrer le bot." }));
    },
    send: function (v) {
      v.appendChild(el("h2", { text: "Envoyer un message avec le bot" }));
      var f = el("div", { class: "form card" });
      var ch = select(channelOptions("text"), "", false, "— choisir un salon —");
      var content = el("textarea", { placeholder: "Texte du message (optionnel)" });
      var title = el("input", { type: "text", placeholder: "Titre de l'embed (optionnel)" });
      var desc = el("textarea", { placeholder: "Texte de l'embed (optionnel)" });
      var color = el("input", { type: "color", value: "#8f63ff" });
      var ping = el("input", { type: "checkbox" });
      [["Salon", ch], ["Message", content], ["Titre de l'embed", title], ["Texte de l'embed", desc], ["Couleur de l'embed", color]].forEach(function (x) { f.appendChild(el("div", { class: "field" }, [el("label", { text: x[0] }), x[1]])); });
      f.appendChild(el("label", { class: "switch" }, [ping, "Autoriser les mentions (@everyone, rôles)"]));
      var go = el("button", { class: "main", type: "button", text: "Envoyer", onclick: function () {
        go.disabled = true;
        api("/api/send", { channelId: ch.value, content: content.value, title: title.value, description: desc.value, color: color.value, ping: ping.checked })
          .then(function () { toast("Message envoyé ✓", true); content.value = ""; desc.value = ""; title.value = ""; }).catch(function (e) { toast(e.message, false); }).then(function () { go.disabled = false; });
      } });
      f.appendChild(el("div", { class: "row" }, [go]));
      v.appendChild(f);
    },
    scams: function (v) {
      v.appendChild(el("h2", { text: "Liste des scammers" }));
      var add = el("div", { class: "form card" });
      var id = el("input", { type: "text", placeholder: "Clic droit sur le membre → Copier l'identifiant" }), reason = el("input", { type: "text", placeholder: "Raison" }), proof = el("input", { type: "text", placeholder: "Lien de la preuve" });
      [["ID Discord", id], ["Raison", reason], ["Preuve", proof]].forEach(function (x) { add.appendChild(el("div", { class: "field" }, [el("label", { text: x[0] }), x[1]])); });
      add.appendChild(el("div", { class: "row" }, [el("button", { class: "main", type: "button", text: "Ajouter", onclick: function () { api("/api/scam", { id: id.value, reason: reason.value, proof: proof.value }).then(function () { toast("Ajouté ✓", true); load(); }).catch(function (e) { toast(e.message, false); }); } })]));
      v.appendChild(add);
      var wrap = el("div", { class: "tablewrap" }); var tb = el("table", {}, [el("tr", {}, [el("th", { text: "Membre" }), el("th", { text: "Raison" }), el("th", { text: "Ajouté le" }), el("th", { text: "" })])]);
      S.scams.forEach(function (s) {
        tb.appendChild(el("tr", {}, [el("td", { text: (s.name ? s.name + " · " : "") + s.id }), el("td", { text: s.reason || "—" }), el("td", { text: s.at ? new Date(s.at).toLocaleDateString("fr-FR") : "—" }),
          el("td", {}, [el("button", { class: "danger", type: "button", text: "Retirer", onclick: function () { api("/api/scam", { id: s.id, remove: true }).then(function () { toast("Retiré ✓", true); load(); }).catch(function (e) { toast(e.message, false); }); } })])]));
      });
      if (!S.scams.length) tb.appendChild(el("tr", {}, [el("td", { colspan: "4", class: "muted", text: "Personne dans la liste." })]));
      wrap.appendChild(tb); v.appendChild(el("div", { style: "margin-top:16px" }, [wrap]));
    },
    console: function (v) {
      v.appendChild(el("div", { class: "row" }, [el("h2", { text: "Console du bot" }), el("button", { type: "button", text: "Actualiser", onclick: load })]));
      var box = el("div", { class: "logs" });
      S.logs.slice().reverse().forEach(function (l) { box.appendChild(el("div", { class: l.level }, [new Date(l.at).toLocaleTimeString("fr-FR") + "  " + l.text])); });
      if (!S.logs.length) box.textContent = "Rien pour le moment.";
      v.appendChild(box);
    }
  };
  function modulePage(page) {
    return function (v) {
      v.appendChild(el("h2", { text: page[1] }));
      var jump = el("div", { class: "jump" });
      page[2].forEach(function (n) { if (S.defaults[n]) jump.appendChild(el("a", { href: "#m-" + n, text: SECTIONS[n][0] })); });
      if (page[2].length > 1) v.appendChild(jump);
      page[2].forEach(function (n) { if (S.defaults[n]) v.appendChild(sectionCard(n)); });
    };
  }
  PAGES.forEach(function (p) { if (p[2]) VIEWS[p[0]] = modulePage(p); });
  function draw() {
    var tabs = $("#tabs"); tabs.textContent = "";
    PAGES.forEach(function (x) { tabs.appendChild(el("button", { type: "button", class: x[0] === tab ? "on" : "", text: x[1], onclick: function () { tab = x[0]; draw(); window.scrollTo(0, 0); } })); });
    var v = $("#view"); v.textContent = ""; VIEWS[tab](v);
  }
  function load() {
    return api("/api/state").then(function (s) {
      S = s;
      $("#bot-name").textContent = s.bot.tag || "Kazuki MM";
      if (s.bot.avatar) $("#bot-ava").src = s.bot.avatar;
      $("#bot-live").textContent = "● en ligne · " + (s.bot.ping == null ? "—" : s.bot.ping + " ms");
      draw();
    }).catch(function (e) { $("#view").textContent = "Erreur : " + e.message; });
  }
  $("#logout").addEventListener("click", function () { api("/api/logout", {}).then(function () { location.href = "/"; }); });
  load();
})();
</script>
