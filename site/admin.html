<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin – Onyx Hub</title>
<style>
:root{--bg:#07080a;--card:#101216;--line:#1d2127;--text:#e8ebef;--mute:#8b94a1;--accent:#28dc78}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,sans-serif;padding:24px 16px}
.w{max-width:640px;margin:0 auto}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:14px}
input,textarea{width:100%;background:#0a0c0f;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px;font:inherit}
textarea{min-height:90px;margin:8px 0;font-family:ui-monospace,monospace;font-size:14px}
button{background:var(--accent);color:#04120a;font-weight:700;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;font:inherit;font-weight:700}
p{color:var(--mute);margin:4px 0 0}
</style></head><body><div class="w">
<h1>Admin – key stock</h1>
<div class="card"><input id="pw" type="password" placeholder="Admin password"><button id="go" style="margin-top:10px">Log in</button></div>
<div id="plans"></div>
<script>
let pw = "";
async function call(body) {
  const r = await fetch("/.netlify/functions/admin-stock", { method: body ? "POST" : "GET", headers: { "x-admin-token": pw }, body: body && JSON.stringify(body) });
  const d = await r.json(); if (!r.ok) throw new Error(d.error); return d;
}
function render(d) {
  const root = document.getElementById("plans"); root.innerHTML = "";
  for (const [id, name] of Object.entries(d.plans)) {
    const c = document.createElement("div"); c.className = "card";
    c.innerHTML = `<b>${name}</b><p>Keys in stock: <b>${d.counts[id]}</b></p><textarea placeholder="One key per line"></textarea><button>Add these keys</button>`;
    c.querySelector("button").onclick = async () => {
      const keys = c.querySelector("textarea").value.split("\n");
      try { render(await call({ plan: id, keys })); } catch (e) { alert(e.message); }
    };
    root.appendChild(c);
  }
}
document.getElementById("go").onclick = async () => {
  pw = document.getElementById("pw").value;
  try { render(await call()); } catch (e) { alert(e.message); }
};
</script></div></body></html>
